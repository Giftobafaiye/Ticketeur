# Dependabot configuration.
#
# Adding this file enables automated dependency *version* updates for the
# ecosystems below and keeps them on a fixed schedule. The Dependabot
# *alerts* and *security updates* toggles are repository settings and are
# not controlled here.
#
# The repository is a pnpm workspace: `pnpm-lock.yaml` and
# `pnpm-workspace.yaml` live at the repository root, so the npm ecosystem is
# monitored once at "/". GitHub Actions usage is monitored separately so the
# pinned action SHAs used by the workflows are kept current.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      npm:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      # github/codeql-action/init and github/codeql-action/analyze are
      # separate dependencies for Dependabot (it keys on the action
      # directory), but CodeQL refuses to run when the two steps disagree on
      # version: init writes a config stamped with its version and analyze
      # aborts with "Loaded a configuration file for version 'X', but running
      # version 'Y'". One PR per release keeps both pinned SHAs in step.
      codeql-action:
        patterns:
          - "github/codeql-action*"
