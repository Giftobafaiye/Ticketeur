name: CI
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

# Least privilege: the job only reads the repository. Keep this explicit so a
# future repo-wide default change cannot silently grant the workflow more.
permissions:
  contents: read

# Superseding is harmless for pull requests: the cancelled run is verifying a
# commit that is not shipping. On `main` every push deploys straight to
# production, so each commit must be verified on its own: the group is keyed by
# the commit sha for pushes, which makes a later push start its own run instead
# of cancelling the earlier commit's, and cancellation is enabled only for pull
# requests.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'push' && github.sha || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "latest"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Scan build configs for injected code
        run: pnpm check:configs

      - name: Scan tracked files for committed secrets
        run: pnpm check:secrets

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build
        env:
          DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci"
          BETTER_AUTH_SECRET: "ci_placeholder_secret_min_32_chars_long_xxxxx"
          BETTER_AUTH_URL: "http://localhost:3000"
          BETTER_AUTH_API_KEY: "ci_placeholder"
          NEXT_PUBLIC_APP_URL: "http://localhost:3000"
          RESEND_API_KEY: "re_ci_placeholder"
          TRIGGER_PROJECT_ID: "proj_ci_placeholder"
          TRIGGER_SECRET_KEY: "tr_ci_placeholder"
