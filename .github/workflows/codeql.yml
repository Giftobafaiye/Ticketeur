name: CodeQL

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  schedule:
    # Weekly, so a new advisory or CodeQL query pack reaches `main` even
    # without a push.
    - cron: "0 6 * * 1"
  workflow_dispatch:

# Least privilege: the scan only needs to read the repository, upload its
# results as a SARIF analysis, and read the run that triggered it.
permissions:
  contents: read

# Superseding is harmless for pull requests: the cancelled run is scanning a
# commit that is not shipping. On `main` every push deploys straight to
# production, so each commit must be scanned on its own: the group is keyed by
# the commit sha for pushes, which makes a later push start its own run instead
# of cancelling the earlier commit's, and cancellation is enabled only for pull
# requests.
concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'push' && github.sha || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language:
          - javascript-typescript
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          languages: ${{ matrix.language }}
          # JavaScript/TypeScript needs no build step for extraction.
          build-mode: none

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          category: "/language:${{ matrix.language }}"
