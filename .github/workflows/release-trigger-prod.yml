name: Deploy Jobs to Trigger.dev (prod)
on:
  push:
    branches:
      - main
    # Must cover every workspace package the worker bundles, plus this file, so
    # that a fix to any of them can re-trigger the deploy it unblocks.
    # @ticketur/jobs depends on @ticketur/db, @ticketur/email and @ticketur/env
    # (the last is reached through @ticketur/db/src/client.ts and
    # packages/jobs/src/utils/resend.ts); @ticketur/auth consumes
    # @ticketur/jobs, so it is not part of the bundle.
    paths:
      - "packages/jobs/**"
      - "packages/db/**"
      - "packages/email/**"
      - "packages/env/**"
      - ".github/workflows/release-trigger-prod.yml"
  workflow_dispatch:
# Least privilege: the job only reads the repository to run the deploy. This
# does not affect the Trigger.dev secrets below, which come from repo secrets.
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.repository == 'Giftobafaiye/Ticketeur'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "latest"
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install
      - name: Deploy to Trigger.dev
        env:
          TRIGGER_ACCESS_TOKEN: ${{ secrets.TRIGGER_ACCESS_TOKEN }}
          TRIGGER_PROJECT_REF: ${{ secrets.TRIGGER_PROJECT_REF }}
        run: pnpm --filter @ticketur/jobs run deploy
