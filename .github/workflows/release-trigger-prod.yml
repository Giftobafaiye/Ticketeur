name: Deploy Jobs to Trigger.dev (prod)
on:
  push:
    branches:
      - main
    # Must cover every workspace package the worker bundles, plus this file, so
    # that a fix to any of them can re-trigger the deploy it unblocks.
    # @ticketur/jobs depends on @ticketur/db, @ticketur/email and @ticketur/env
    # (the last is reached through @ticketur/db/src/client.ts and
    # packages/jobs/src/utils/resend.ts); @ticketur/auth consumes
    # @ticketur/jobs, so it is not part of the bundle.
    # Also cover the dependency-resolution inputs: the lockfile, the root
    # manifest (packageManager, root tooling) and the workspace config. A
    # dependency change can land in any of these without touching a
    # packages/*/package.json, and the deploy builds from them at deploy time,
    # so missing them would silently leave the worker on old versions.
    paths:
      - "packages/jobs/**"
      - "packages/db/**"
      - "packages/email/**"
      - "packages/env/**"
      - "pnpm-lock.yaml"
      - "package.json"
      - "pnpm-workspace.yaml"
      - ".github/workflows/release-trigger-prod.yml"
  workflow_dispatch:
# Least privilege: the job only reads the repository to run the deploy. The
# Trigger.dev deploy credentials are resolved through the Production
# environment below.
permissions:
  contents: read
# Serialize production publishes. Never cancel a deploy that is already
# shipping, and let a newer push supersede an older queued one so the newest
# worker revision is the one that wins.
concurrency:
  group: release-trigger-prod-${{ github.ref }}
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.repository == 'Giftobafaiye/Ticketeur'
    # Route the deploy through the Production environment so an admin can
    # attach required reviewers and deployment-branch rules to it.
    environment: Production
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          # Pin the build runtime. The worker declares runtime: node-24 in
          # packages/jobs/trigger.config.ts, so build on that major instead of a
          # floating "latest".
          node-version: "24"
          cache: "pnpm"
      # Gate the publish on the same checks CI runs, so a commit that fails the
      # injected-code scan or typecheck cannot ship the production worker. The
      # worker bundle itself is compiled by the deploy step below.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Scan build configs for injected code
        run: pnpm check:configs
      - name: Scan tracked files for committed secrets
        run: pnpm check:secrets
      - name: Typecheck
        run: pnpm typecheck
      - name: Deploy to Trigger.dev
        env:
          TRIGGER_ACCESS_TOKEN: ${{ secrets.TRIGGER_ACCESS_TOKEN }}
          TRIGGER_PROJECT_REF: ${{ secrets.TRIGGER_PROJECT_REF }}
        run: pnpm --filter @ticketur/jobs run deploy
